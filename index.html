<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#F3F5FA">
  <meta name="description" content="Ο προσωπικός σου χώρος εργασίας. Προτεραιότητες, εφαρμογές και συνεργασία με τους agents σου.">
  <title>ΠΟΥΛΟΣ — Workstation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700;750;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Μετάβαση στο περιεχόμενο</a>
  <div id="auth-screen" class="auth-screen" hidden></div>
  <div id="boot-screen" class="boot-screen"><div class="brand-mark">Π</div><p>Ανοίγει ο χώρος εργασίας σου…</p><span class="loading-line"></span></div>
  <div id="workstation" class="workstation" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Πλοήγηση">
      <a class="brand" href="./" aria-label="ΠΟΥΛΟΣ αρχική"><span class="brand-mark">Π</span><span>ΠΟΥΛΟΣ<span class="brand-sub">Workstation</span></span></a>
      <button class="mobile-close icon-button" id="close-nav" aria-label="Κλείσιμο πλοήγησης"></button>
      <nav class="main-nav" id="main-nav" aria-label="Κύρια πλοήγηση"></nav>
      <div class="spaces-nav"><div class="sidebar-label">Οι χώροι μου</div><nav id="workspace-nav" aria-label="Χώροι εργασίας"></nav></div>
      <div class="sidebar-bottom">
        <a href="./workspace.html" class="sidebar-link" id="advanced-link"></a>
        <div class="account"><div class="avatar" aria-hidden="true">Π</div><div class="account-text"><b>Ο λογαριασμός μου</b><span id="account-email"></span></div><button class="icon-button" id="logout" aria-label="Αποσύνδεση" title="Αποσύνδεση"></button></div>
      </div>
    </aside>
    <button class="nav-overlay" id="nav-overlay" aria-label="Κλείσιμο πλοήγησης" hidden></button>
    <div class="main-shell">
      <header class="topbar">
        <div class="breadcrumb"><button class="icon-button mobile-menu" id="open-nav" aria-label="Άνοιγμα πλοήγησης" aria-expanded="false" aria-controls="sidebar"></button><span class="breadcrumb-home">Ο χώρος μου</span><span class="breadcrumb-separator">/</span><span id="breadcrumb-view">Σήμερα</span></div>
        <div class="topbar-actions"><label class="search-box"><span id="search-icon" aria-hidden="true"></span><input id="global-search" type="search" placeholder="Αναζήτηση στον χώρο μου" aria-label="Αναζήτηση εργασιών, εισερχομένων και εφαρμογών"><kbd>/</kbd></label><button class="icon-button" id="refresh" aria-label="Ανανέωση δεδομένων" title="Ανανέωση"></button></div>
      </header>
      <main id="main-content" tabindex="-1">
        <div id="global-error" class="alert error" role="alert" hidden></div>
        <div class="page-heading"><div><div id="today-date" class="today-date"></div><h1 id="view-title">Καλημέρα, Γιάννη.</h1><p id="view-description">Ο χώρος σου, σε μία εικόνα.</p></div><button class="button primary" id="new-task"></button></div>
        <div id="scope-bar" class="scope-bar"></div>
        <div id="status-strip" class="status-strip" aria-live="polite"></div>
        <div id="view-content" aria-busy="true"></div>
        <footer class="page-footer"><span>ΠΟΥΛΟΣ Workstation</span><span id="footer-status">Προσωπικοί και επαγγελματικοί χώροι, με ξεχωριστό πλαίσιο.</span></footer>
      </main>
    </div>
  </div>
  <dialog id="task-dialog" aria-labelledby="task-dialog-title"><div id="task-dialog-content"></div></dialog>
  <dialog id="connection-dialog" aria-labelledby="connection-dialog-title"><div id="connection-dialog-content"></div></dialog>
  <dialog id="handoff-dialog" class="wide-dialog" aria-labelledby="handoff-dialog-title"><div id="handoff-dialog-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
